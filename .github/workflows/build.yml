name: Build APK

on:
  push:
    branches: [ master, build/** ]
    # A v<versionName> tag (e.g. v0.10.2-ar.0.1) also publishes a GitHub Release with the APK
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build release and debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :lms-material:assembleRelease :lms-material:assembleDebug \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lms-material-release
          path: lms-material/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lms-material-debug
          path: lms-material/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' lms-material/build.gradle)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match versionName $version" >&2
            exit 1
          fi
          apk="lms-material-app-ar-$version.apk"
          dapk="lms-material-app-ar-$version-debug.apk"
          cp lms-material/build/outputs/apk/release/*.apk "$apk"
          cp lms-material/build/outputs/apk/debug/*.apk "$dapk"
          # Its player too (regular and debug), so that all APKs are in one place
          ptag=$(gh release view -R arigit/squeezelite --json tagName -q .tagName)
          gh release download "$ptag" -R arigit/squeezelite --pattern 'squeezelite-ar-*.apk'
          player=$(ls squeezelite-ar-*.apk | grep -v -- '-debug\.apk$')
          dplayer=$(ls squeezelite-ar-*-debug.apk 2>/dev/null || true)
          players=https://github.com/arigit/squeezelite/releases
          {
            echo "lms-material-app (ar) $version (shown on the phone as Lyrion (ar)). Install both APKs: $apk and its player $player (the latest Squeezelite (ar) release, from $players) - see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/master/Android-Auto-Readme.md for setup."
            echo
            echo "Its player at the time: [Squeezelite (ar) ${ptag#v}]($players/tag/$ptag). Newest Squeezelite (ar): $players/latest"
            echo
            cat <<'EOF'
          ### Debug builds

          The `-debug` APKs are for troubleshooting: same code, but they also write a log file on the phone that can be shared with the developer. Most users want the regular APKs.

          - **Lyrion (ar) debug** installs as a separate app (`com.craigd.lmsmaterial.app.ar.debug`, also called "Lyrion (ar)") next to the regular one, with its own settings.
          - **Squeezelite (ar) debug** replaces the regular Squeezelite (ar) (same app, same signing key, settings kept); install the regular APK again to go back.

          Log files (4 MB each; when full, a file is renamed to `<name>.1`, which holds the older entries):

          | App | Log files |
          |---|---|
          | Lyrion (ar) debug | `/data/data/com.craigd.lmsmaterial.app.ar.debug/files/lms.log`, `lms.log.1` |
          | Squeezelite (ar) debug | `/data/data/org.lyrion.squeezelite.ar/files/player.log`, `player.log.1` (the player), `ui.log`, `ui.log.1` (its settings screen) |

          They are in the app's private storage, which file managers can't open. To copy them to a computer, turn on USB debugging (Settings → Developer options) and connect the phone with [adb](https://developer.android.com/tools/adb):

          ```
          adb exec-out run-as com.craigd.lmsmaterial.app.ar.debug cat files/lms.log > lms.log
          adb exec-out run-as com.craigd.lmsmaterial.app.ar.debug cat files/lms.log.1 > lms.log.1
          adb exec-out run-as org.lyrion.squeezelite.ar cat files/player.log > player.log
          adb exec-out run-as org.lyrion.squeezelite.ar cat files/player.log.1 > player.log.1
          ```

          (`run-as` only works for debug builds; a `.1` file only exists once the log has filled up once.)
          EOF
          } > notes.md
          gh release create "$TAG" "$apk" "$dapk" "$player" $dplayer --title "lms-material-app (ar) $version" --notes-file notes.md
